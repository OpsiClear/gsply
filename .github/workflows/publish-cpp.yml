name: Publish gsply-cpp (wheels)

# Builds prebuilt wheels for the C++ backend (cpp/, package "gsply-cpp") for
# Linux x86_64, Windows AMD64, and macOS arm64 plus an sdist, and publishes to
# PyPI via trusted publishing. Wheels are built for CPython 3.10-3.13 so
# `pip install "gsply[cpp]"`
# can resolve a binary backend for every Python version supported by gsply.
#
# Triggers:
#   - push a tag "cpp-v<X.Y.Z>" (must match cpp/pyproject.toml version) -> build + publish
#   - workflow_dispatch -> build + test wheels only (no publish), for verification
#
# One-time PyPI setup (cannot be done from here): add a Trusted Publisher for the
# "gsply-cpp" project at https://pypi.org/manage/account/publishing/ ->
#   Owner: OpsiClear   Repository: gsply
#   Workflow: publish-cpp.yml   Environment: pypi
# (Use a "pending publisher" if the project doesn't exist yet; the first run creates it.)

on:
  push:
    tags: ["cpp-v*"]
  workflow_dispatch:

jobs:
  python-wheel:
    name: gsply wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build gsply wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: gsply-wheel
          path: dist/*.whl

  wheels:
    name: wheels-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest          # manylinux x86_64
          - os: windows-latest         # win_amd64
          - os: macos-14               # macOS arm64
            macos_target: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          package-dir: cpp
          output-dir: wheelhouse
        env:
          # Match gsply's supported Python range with version-specific wheels.
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_BUILD_FRONTEND: build
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
          # Smoke-test the built wheel: a real PLY round-trip through the C++ backend.
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: >-
            python -c "import os, tempfile, numpy as np, gsply_cpp;
            n=64;
            me=np.random.rand(n,3).astype('float32'); sc=np.random.rand(n,3).astype('float32');
            q=np.tile(np.array([1,0,0,0],'float32'),(n,1)); op=np.random.rand(n).astype('float32');
            s0=np.random.rand(n,3).astype('float32');
            p=os.path.join(tempfile.mkdtemp(),'t.ply');
            gsply_cpp.write_ply(p, me, sc, q, op, s0, None);
            d=gsply_cpp.read_ply(p);
            assert d['means'].shape==(n,3);
            print('gsply_cpp wheel OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  verify-pip-extra:
    name: verify gsply[cpp] (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [python-wheel, wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gsply-wheel
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary ":all:" numpy numba
      - name: Install gsply[cpp] from release artifacts
        run: |
          python -m pip install --no-index --find-links dist --only-binary ":all:" "gsply[cpp]"
          python -m pip check
      - name: Verify C++ backend e2e
        run: |
          python -c "import os, tempfile, numpy as np, gsply, gsply_cpp; gsply.use_backend('cpp'); assert gsply.active_backend() == 'cpp'; n=64; means=np.random.rand(n,3).astype('float32'); scales=np.random.rand(n,3).astype('float32'); quats=np.tile(np.array([1,0,0,0], dtype='float32'), (n,1)); opacities=np.random.rand(n).astype('float32'); sh0=np.random.rand(n,3).astype('float32'); data=gsply.GSData.from_arrays(means, scales, quats, opacities, sh0, format='ply'); d=tempfile.mkdtemp(); p=os.path.join(d, 'roundtrip.ply'); gsply.plywrite(p, data); out=gsply.plyread(p); assert len(out) == n; assert out.means.shape == (n, 3); print('gsply[cpp] e2e OK')"

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches cpp version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cpp-v')
        run: |
          python -c "import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path('cpp/pyproject.toml').read_text())['project']['version']; expected = f'cpp-v{version}'; tag = os.environ['GITHUB_REF_NAME']; assert tag == expected, f'tag {tag} does not match {expected}'"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist cpp
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [verify-pip-extra, sdist]
    runs-on: ubuntu-latest
    # Only publish for tag pushes (workflow_dispatch builds + tests but does not publish).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cpp-v')
    environment:
      name: pypi
      url: https://pypi.org/p/gsply-cpp
    permissions:
      id-token: write  # mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          verbose: true
