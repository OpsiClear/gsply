name: Verify pip install gsply[cpp]

on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: Package spec to install from PyPI
        required: true
        default: "gsply[cpp]"

jobs:
  verify:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary ":all:" "${{ inputs.package_spec }}"
          python -m pip check

      - name: Verify C++ backend e2e
        run: |
          python -c "import os, tempfile, numpy as np, gsply, gsply_cpp; gsply.use_backend('cpp'); assert gsply.active_backend() == 'cpp'; n=64; means=np.random.rand(n,3).astype('float32'); scales=np.random.rand(n,3).astype('float32'); quats=np.tile(np.array([1,0,0,0], dtype='float32'), (n,1)); opacities=np.random.rand(n).astype('float32'); sh0=np.random.rand(n,3).astype('float32'); data=gsply.GSData.from_arrays(means, scales, quats, opacities, sh0, format='ply'); d=tempfile.mkdtemp(); p=os.path.join(d, 'roundtrip.ply'); gsply.plywrite(p, data); out=gsply.plyread(p); assert len(out) == n; assert out.means.shape == (n, 3); print('gsply[cpp] PyPI e2e OK')"
