[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "gsply-cpp"
version = "0.1.0"
description = "C++ parity implementation of gsply (Gaussian-splat PLY/SPZ I/O) with nanobind bindings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpsiClear", email = "yehe@opsiclear.com" }]
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest", "gsply>=0.3.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

# Stable ABI wheels for CPython 3.12+ (matches STABLE_ABI in CMake).
[tool.scikit-build.wheel]
py-api = "cp312"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# shN is the domain term; gzip-read-and-decompress is fine without a context mgr.
"tests/*.py" = ["N806", "SIM115"]
